---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
polling_verb: get
framework_version: 3.1.1
serverless_language: node
polling_url: '{{ api_url }}entries?limit={{ limit }}&order={{ order }}&direction={{ direction }}{% for s in status %}&status={{ s }}{% endfor %}{% if starred == true or starred == "true" %}&starred=true{% endif %}{% if globally_visible == true or globally_visible == "true" %}&globally_visible=true{% endif %}{% if search != blank %}&search={{ search | url_encode }}{% endif %}{% if category_id != blank %}&category_id={{ category_id }}{% endif %}'
polling_headers: X-Auth-Token={{ token | url_encode }}
polling_body: ''
id: 392974
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
custom_fields:
- keyname: author_info
  name: About This Plugin
  field_type: author_bio
  category: news,entertainment
  description: This plugin was created by Henrique Dias. Help improve this plugin on GitHub.
  learn_more_url: https://hacdias.com
  github_url: https://github.com/hacdias/trmnl-miniflux
- keyname: api_url
  field_type: url
  name: Miniflux API Endpoint
  description: Endpoint of your Miniflux API.
  placeholder: https://flux.mydomain.com/v1/
  help_text: Please include http:// or https:// and trailing slash (/)
  optional: false
- keyname: token
  field_type: password
  name: Token
  description: Miniflux API Token.
  placeholder: your-token-from-miniflux
  optional: false
- keyname: status
  field_type: select
  multiple: true
  options:
  - unread
  - read
  name: Entry Status
  optional: true
  default: unread
  description: Which entry statuses to pull? Defaults to unread; clear to include all.
  help_text: Hold ⌘ (macOS) or Ctrl to select multiple statuses.
- keyname: limit
  field_type: number
  placeholder: '30'
  name: Entry Limit
  default: 30
  description: The maximum amount of entries to pull.
- keyname: category_id
  field_type: number
  placeholder: '5'
  name: Category ID Filter
  optional: true
  description: Filter entries from a specific category ID.
- keyname: search
  field_type: string
  optional: true
  name: Search Query
  description: Term to filter by.
  placeholder: recipe
- keyname: starred
  field_type: boolean
  default: false
  name: Only Get Starred Entries
  description: When enabled, only starred (favorite) entries are returned.
- keyname: globally_visible
  field_type: boolean
  default: false
  name: Globally Visible Only
  description: Only include entries from feeds/categories not hidden from global views.
- keyname: order
  field_type: select
  options:
  - id
  - published_at
  - created_at
  - changed_at
  name: Order Entries
  default: id
  optional: false
  description: Which property to order the entries by?
- keyname: direction
  field_type: select
  options:
  - asc
  - desc
  name: Sort Direction
  optional: false
  default: desc
  description: Sort entries in an ascending/descending manner.
- keyname: show_category
  field_type: select
  optional: false
  options:
  - true
  - false
  default: true
  name: Show Category Badge
  description: Show each entry's category as a badge.
name: Miniflux
description: Display your Miniflux feed entries
refresh_interval: 15
